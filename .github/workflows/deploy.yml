# Build static site (inject WEB3FORMS_ACCESS_KEY from Secrets) and deploy to GitHub Pages.
# 1. Add WEB3FORMS_ACCESS_KEY in repo Settings → Secrets and variables → Actions.
# 2. Settings → Pages → Source: Deploy from a branch → Branch: gh-pages, / (root).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run build
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
